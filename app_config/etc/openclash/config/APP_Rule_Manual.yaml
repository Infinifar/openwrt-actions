  CustomProxy:
    type: http
    behavior: classical
    url: https://ghproxy.wegod.cc/https://raw.githubusercontent.com/alecthw/chnlist/release/Providers/Custom/CustomProxy.yaml
    path: ./rule_provider/CustomProxy.yaml
