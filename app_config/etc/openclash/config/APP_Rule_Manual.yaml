rules:
  # Only AI/Google domains: keep TCP, other UDP ports and unrelated QUIC unchanged.
  - AND,((NETWORK,UDP),(DST-PORT,443),(GEOSITE,google)),REJECT-DROP
  - AND,((NETWORK,UDP),(DST-PORT,443),(GEOSITE,openai)),REJECT-DROP
  - AND,((NETWORK,UDP),(DST-PORT,443),(GEOSITE,anthropic)),REJECT-DROP
  - AND,((NETWORK,UDP),(DST-PORT,443),(GEOSITE,github-copilot)),REJECT-DROP
  - AND,((NETWORK,UDP),(DST-PORT,443),(OR,((DOMAIN-SUFFIX,antigravity.google),(DOMAIN-SUFFIX,copilot.microsoft.com),(DOMAIN-SUFFIX,sydney.bing.com),(DOMAIN-SUFFIX,edgeservices.bing.com),(DOMAIN-SUFFIX,services.bingapis.com),(DOMAIN-SUFFIX,gateway.bingviz.microsoft.net),(DOMAIN-SUFFIX,gateway.bingviz.microsoftapp.net),(DOMAIN-SUFFIX,openai.com),(DOMAIN-SUFFIX,chatgpt.com),(DOMAIN-SUFFIX,oaistatic.com),(DOMAIN-SUFFIX,oaiusercontent.com),(DOMAIN-SUFFIX,openai.com.cdn.cloudflare.net),(DOMAIN-SUFFIX,chatgpt.com.cdn.cloudflare.net)))),REJECT-DROP
  # - PROCESS-NAME,zerotier-one,DIRECT

  # Local network, should be resolve
  - RULE-SET,Lan,DIRECT

  # Custom force
  - RULE-SET,CustomDirect,Domestic
  - RULE-SET,CustomProxy,Proxy
  - RULE-SET,Direct,Domestic
  - RULE-SET,CustomReject,AdBlock

  # Ban Ads
  - RULE-SET,AdvertisingLite,AdBlock
  - RULE-SET,AdvertisingLite_Domain,AdBlock
  - RULE-SET,AdvertisingMiTV,AdBlock

  # Apple
  - RULE-SET,Apple,Apple
  - RULE-SET,Apple_Domain,Apple

  # Download
  - RULE-SET,DockerHubExtra,Docker
  - RULE-SET,Docker,Docker
  - RULE-SET,Download,Domestic
  - RULE-SET,GameDownloadCN,Domestic
  - RULE-SET,GameDownload,Domestic

  # APP
  # AI rules must precede Google because Gemini uses Google domains.
  - RULE-SET,OpenAI,AI
  - RULE-SET,Claude,AI
  - RULE-SET,Gemini,AI
  - RULE-SET,Copilot,AI
  - RULE-SET,Google,Google
  - RULE-SET,Telegram,Telegram
  - RULE-SET,Speedtest,Speedtest
  - RULE-SET,PayPal,PayPal
  - RULE-SET,Steam,Steam
  - RULE-SET,Epic,Epic
  - RULE-SET,UBI,Ubisoft
  - RULE-SET,Ubisoft,Ubisoft
  - RULE-SET,Nintendo,Nintendo
  - RULE-SET,Xbox,Xbox
  - RULE-SET,Microsoft,Microsoft

  # China Media
  - RULE-SET,ChinaMedia,Domestic

  # Media
  - RULE-SET,TikTok,TikTok
  - RULE-SET,Disney,DisneyPlus
  - RULE-SET,Netflix,Netflix
  - RULE-SET,Spotify,Spotify
  - RULE-SET,AmazonPrimeVideo,GlobalMedia
  - RULE-SET,HBO,GlobalMedia
  - RULE-SET,GlobalMedia,GlobalMedia
  - RULE-SET,GlobalMedia_Domain,GlobalMedia

  # Force proxy
  - RULE-SET,ProxyLite,Proxy

  # Force china direct
  - RULE-SET,China,Domestic
  - RULE-SET,China_Domain,Domestic

  # CN, should be resolve
  - GEOIP,CN,Domestic

  # Final
  - MATCH,Final

rule-providers:
  # Local network, should be resolve
  Lan:
    type: http
    behavior: classical
    url: https://ghproxy.wegod.cc/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan_No_Resolve.yaml
