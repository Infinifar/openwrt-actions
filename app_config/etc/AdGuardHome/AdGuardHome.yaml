http:
  pprof:
    port: 6060
    enabled: false
  doh:
    routes:
    - GET /dns-query
    - POST /dns-query
    - GET /dns-query/{ClientID}
    - POST /dns-query/{ClientID}
    insecure_enabled: false
  address: 127.0.0.1:3000
  session_ttl: 720h
users: []
auth_attempts: 5
block_auth_min: 15
http_proxy: http://127.0.0.1:7890
language: ''
theme: auto
dns:
  bind_hosts:
  - 0.0.0.0
  - '::'
  port: 53
  anonymize_client_ip: false
  ratelimit: 0
  ratelimit_subnet_len_ipv4: 24
  ratelimit_subnet_len_ipv6: 56
  ratelimit_whitelist: []
  refuse_any: true
  upstream_dns:
  - 127.0.0.1:7874
  upstream_dns_file: ''
  bootstrap_dns:
  - 223.5.5.5
  - 119.29.29.29
  - 1.1.1.1
  fallback_dns:
  - 127.0.0.1:5335
  upstream_mode: parallel
  fastest_timeout: 1s
  allowed_clients: []
  disallowed_clients: []
  blocked_hosts:
  - version.bind
  - id.server
  - hostname.bind
  trusted_proxies:
  - 127.0.0.1/8
  - ::1/128
  cache_enabled: false
  cache_size: 0
  cache_ttl_min: 10
  cache_ttl_max: 600
  cache_optimistic: false
  cache_optimistic_answer_ttl: 30s
  cache_optimistic_max_age: 12h
  bogus_nxdomain: []
  aaaa_disabled: false
  enable_dnssec: false
  edns_client_subnet:
    custom_ip: ''
    enabled: false
    use_custom: false
  max_goroutines: 300
  handle_ddr: true
  ipset: []
  ipset_file: ''
  bootstrap_prefer_ipv6: false
  upstream_timeout: 10s
  private_networks: []
  use_private_ptr_resolvers: false
  local_ptr_upstreams: []
  use_dns64: false
  dns64_prefixes: []
  serve_http3: false
  use_http3_upstreams: false
  serve_plain_dns: true
  hostsfile_enabled: true
  pending_requests:
    enabled: true
tls:
  enabled: false
  server_name: ''
  force_https: false
  port_https: 443
  port_dns_over_tls: 853
  port_dns_over_quic: 853
  port_dnscrypt: 0
  dnscrypt_config_file: ''
  certificate_chain: ''
  private_key: ''
  certificate_path: ''
  private_key_path: ''
  strict_sni_check: false
querylog:
  dir_path: /etc/AdGuardHome/work/data
  ignored: []
  interval: 168h
  size_memory: 1000
  enabled: true
  ignored_enabled: false
  file_enabled: false
statistics:
  dir_path: /etc/AdGuardHome/work/data
  ignored: []
  interval: 168h
  enabled: true
  ignored_enabled: false
filters:
- enabled: false
  url: https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
  name: AdGuard DNS filter
  id: 1
- enabled: true
  url: https://adaway.org/hosts.txt
  name: AdAway Default Blocklist
  id: 2
- enabled: true
  url: https://anti-ad.net/easylist.txt
  name: 'CHN: anti-AD'
  id: 3
- enabled: true
  url: https://easylist-downloads.adblockplus.org/easylist.txt
  name: EasyList
  id: 4
- enabled: true
  url: https://easylist-downloads.adblockplus.org/easylistchina.txt
  name: EasyList China
  id: 5
- enabled: true
  url: https://easylist-downloads.adblockplus.org/easyprivacy.txt
  name: EasyPrivacy
  id: 6
- enabled: true
  url: https://www.i-dont-care-about-cookies.eu/abp/
  name: I don't care about cookies
  id: 7
- enabled: true
  url: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/AWAvenue-Ads-Rule.txt
  name: AWAvenue-Ads-Rule
  id: 8
whitelist_filters: []
user_rules:
- '@@||dns.weixin.qq.com.cn^'
dhcp:
  enabled: false
  interface_name: ''
  local_domain_name: lan
  dhcpv4:
    gateway_ip: ''
    subnet_mask: ''
    range_start: ''
    range_end: ''
    lease_duration: 86400
    icmp_timeout_msec: 1000
    options: []
  dhcpv6:
    range_start: ''
    lease_duration: 86400
    ra_slaac_only: false
    ra_allow_slaac: false
filtering:
  blocking_ipv4: ''
  blocking_ipv6: ''
  blocked_services:
    schedule:
      time_zone: UTC
    ids:
    - betano
    - betfair
    - betway
    - blaze
  protection_disabled_until: null
  safe_search:
    enabled: false
    bing: false
    duckduckgo: false
    ecosia: false
    google: false
    pixabay: false
    yandex: false
    youtube: false
  blocking_mode: default
  parental_block_host: family-block.dns.adguard.com
  safebrowsing_block_host: standard-block.dns.adguard.com
  rewrites: []
  safe_fs_patterns:
  - /etc/AdGuardHome/data/userfilters/*
  safebrowsing_cache_size: 1048576
  safesearch_cache_size: 1048576
  parental_cache_size: 1048576
  cache_time: 30
  filters_update_interval: 24
  blocked_response_ttl: 10
  filtering_enabled: true
  rewrites_enabled: true
  parental_enabled: false
  safebrowsing_enabled: false
  protection_enabled: true
clients:
  runtime_sources:
    whois: true
    arp: true
    rdns: true
    dhcp: true
    hosts: true
  persistent: []
log:
  enabled: true
  file: ''
  max_backups: 0
  max_size: 100
  max_age: 3
  compress: false
  local_time: false
  verbose: false
os:
  group: ''
  user: ''
  rlimit_nofile: 0
schema_version: 34
